# ─────────────────────────────────────────────────────────────────────────────
# 生成贡献贪吃蛇动画 SVG，并推送到 output 分支
# 每 24 小时自动运行一次，也可以在 Actions 页面手动触发
# ─────────────────────────────────────────────────────────────────────────────
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 00:00 自动运行
  workflow_dispatch:           # 支持手动触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          # ⚠️ TODO：如果你的 GitHub 用户名不是 Zwenrenmuyuan，请修改下面这行
          github_user_name: Zwenrenmuyuan
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
